<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#060914">
  <title>HisuOS · Setting</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header><strong>HisuOS</strong><span>Setting</span><button id="connection" type="button" title="Ngắt kết nối và kết thúc phiên" disabled>Đang kết nối…</button></header>
  <main>
    <section id="login-section">
      <h1>Setting</h1>
      <button id="login-button" type="button" title="Thử lại kết nối" aria-label="Thử lại kết nối">↻</button>
    </section>
    <section id="editor" hidden>
      <nav class="tabs" role="tablist" aria-label="Setting">
        <button id="tab-wifi" role="tab" aria-controls="panel-wifi" aria-selected="true" type="button">Wi-Fi</button>
        <button id="tab-wallpaper" role="tab" aria-controls="panel-wallpaper" aria-selected="false" tabindex="-1" type="button">Hình nền</button>
        <button id="tab-device" role="tab" aria-controls="panel-device" aria-selected="false" tabindex="-1" type="button">Thiết bị</button>
      </nav>
      <section id="panel-wifi" role="tabpanel" aria-labelledby="tab-wifi">
        <div class="wifi-heading"><h1>Wi-Fi</h1><label class="toggle"><input id="wifi-enabled" type="checkbox">Bật Wi-Fi</label><button id="wifi-scan" type="button" title="Quét Wi-Fi" aria-label="Quét Wi-Fi">↻</button></div>
        <p id="wifi-status" role="status"></p>
        <p class="msg" role="status" aria-live="polite"></p>
        <div id="wifi-networks" class="wifi-networks" aria-label="Mạng Wi-Fi"></div>
        <p id="wifi-empty" hidden>Không tìm thấy mạng</p>
        <button id="wifi-hidden" class="secondary" type="button">Thêm mạng</button>
        <dialog id="wifi-dialog" aria-labelledby="wifi-dialog-title">
        <div class="dialog-heading"><h2 id="wifi-dialog-title">Kết nối Wi-Fi</h2><button id="wifi-cancel" type="button" title="Đóng" aria-label="Đóng">×</button></div>
        <form id="wifi-join">
          <label for="wifi-ssid">SSID</label><input id="wifi-ssid" maxlength="32" required autocomplete="off">
          <label for="wifi-password">Mật khẩu</label><input id="wifi-password" type="password" maxlength="64" autocomplete="off">
          <button id="wifi-connect" type="submit">Kết nối</button>
        </form>
        </dialog>
        <!-- Lucide Wi-Fi and lock-keyhole icons: https://github.com/lucide-icons/lucide
        ISC License. Copyright (c) 2026 Lucide Icons and Contributors.
        Permission to use, copy, modify, and/or distribute this software for any
        purpose with or without fee is hereby granted, provided that the above
        copyright notice and this permission notice appear in all copies.
        THE SOFTWARE IS PROVIDED "AS IS" AND THE AUTHOR DISCLAIMS ALL WARRANTIES
        WITH REGARD TO THIS SOFTWARE INCLUDING ALL IMPLIED WARRANTIES OF
        MERCHANTABILITY AND FITNESS. IN NO EVENT SHALL THE AUTHOR BE LIABLE FOR
        ANY SPECIAL, DIRECT, INDIRECT, OR CONSEQUENTIAL DAMAGES OR ANY DAMAGES
        WHATSOEVER RESULTING FROM LOSS OF USE, DATA OR PROFITS, WHETHER IN AN
        ACTION OF CONTRACT, NEGLIGENCE OR OTHER TORTIOUS ACTION, ARISING OUT OF
        OR IN CONNECTION WITH THE USE OR PERFORMANCE OF THIS SOFTWARE. -->
        <template id="wifi-row-template">
          <button class="wifi-row" type="button">
            <span class="wifi-signal-wrap" aria-hidden="true"><svg class="wifi-signal" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path class="wave-high" d="M2 8.82a15 15 0 0 1 20 0"/><path class="wave-mid" d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></svg><span class="wifi-warning" hidden>!</span></span>
            <span class="wifi-copy"><span class="wifi-name"></span><span class="wifi-note"></span></span>
            <svg class="wifi-lock" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="16" r="1"/><rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>
          </button>
        </template>
      </section>
      <section id="panel-wallpaper" role="tabpanel" aria-labelledby="tab-wallpaper" hidden>
      <div class="workspace">
        <div class="preview">
          <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
          <div class="frame" data-empty="true"><canvas id="preview" width="240" height="240" tabindex="0" aria-label="Ảnh nền 240 × 240. Nhấn Enter để chọn ảnh."></canvas><img id="gif-preview" alt="" draggable="false" hidden><div class="drop" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5h6"/><path d="M19 2v6"/><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1 2-2V5a2 2 0 0 1 2-2h7.5"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/><circle cx="9" cy="9" r="2"/></svg><b>Chạm để chọn ảnh</b><small>PNG/JPEG/WebP/GIF ≤8 MB</small></div>
            <div id="loading" class="loading" role="status" aria-live="polite" hidden><span class="spinner" aria-hidden="true"></span><b id="loading-text"></b><span class="bar" id="loading-bar" aria-hidden="true"><i id="loading-fill"></i></span></div></div>
          <div class="zoom"><label for="zoom">Thu phóng <output id="zoom-value">100%</output></label><input id="zoom" type="range" min="100" max="400" step="1" value="100" disabled></div>
          <p id="message" class="msg" role="status" aria-live="polite"></p></div>
        <form id="upload">
          <h1>Hình nền</h1>
          <label for="fit">Bố cục</label><select id="fit"><option value="cover">Lấp đầy</option><option value="contain">Giữ toàn bộ</option></select>
          <label for="background">Màu nền</label><input id="background" type="color" value="#000000">
          <div class="actions"><button id="reset-view" class="secondary" type="button" disabled>Đặt lại</button><button id="send" type="submit" disabled>Gửi ảnh</button></div>
        </form>
      </div>
      </section>
      <section id="panel-device" role="tabpanel" aria-labelledby="tab-device" hidden>
        <h1>Thiết bị</h1>
        <p class="msg" role="status" aria-live="polite"></p>
        <label for="brightness">Độ sáng <output id="brightness-value"></output></label><input id="brightness" type="range" min="10" max="100" step="1" data-setting="brightness">
        <label for="volume">Âm lượng <output id="volume-value"></output></label><input id="volume" type="range" min="0" max="100" step="1" data-setting="volume">
        <label class="toggle"><input id="speaker" type="checkbox" data-setting="speaker">Loa</label>
        <label for="theme">Giao diện</label><select id="theme" data-setting="theme"><option value="0">Tối</option><option value="1">Sáng</option></select>
        <label for="timeout">Tắt màn hình sau</label><select id="timeout" data-setting="timeout"><option value="0">Không tự tắt</option><option value="30">30 giây</option><option value="60">1 phút</option><option value="120">2 phút</option><option value="300">5 phút</option><option value="600">10 phút</option></select>
        <label for="timezone">Múi giờ UTC (phút)</label><input id="timezone" type="number" min="-720" max="840" step="1" data-setting="timezone">
        <button id="time-sync" type="button">Đồng bộ giờ điện thoại</button>
        <form id="asr-key-form" autocomplete="off">
          <h2>Lệnh giọng nói tiếng Việt</h2>
          <p id="asr-key-status" role="status"></p>
          <label for="asr-key">Groq API key</label>
          <input id="asr-key" type="password" maxlength="127" autocomplete="off" spellcheck="false" placeholder="gsk_…">
          <button id="asr-key-save" type="submit">Lưu key</button>
          <button id="asr-key-clear" class="secondary" type="button">Xóa key</button>
        </form>
        <form id="gemini-key-form" autocomplete="off">
          <h2>Trả lời bằng giọng nói</h2>
          <p id="gemini-key-status" role="status"></p>
          <label for="gemini-key">Gemini API key</label>
          <input id="gemini-key" type="password" maxlength="127" autocomplete="off" spellcheck="false">
          <button id="gemini-key-save" type="submit">Lưu key</button>
          <button id="gemini-key-clear" class="secondary" type="button">Xóa key</button>
        </form>
      </section>
    </section>
  </main>
</body>
</html>
