<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>HisuOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1511;--surface:#14221a;--raise:#1b2e23;--line:#25382c;--text:#eaf3ed;--muted:#8da598;--accent:#7ee0a8;--ink:#082015;--danger:#ff8d7a;--r:20px;
font:16px/1.5 "Be Vietnam Pro",system-ui,sans-serif;color-scheme:dark light}
@media (prefers-color-scheme:light){:root{--bg:#f2f7f4;--surface:#fff;--raise:#eef5f0;--line:#dbe6df;--text:#10201a;--muted:#5b7266;--accent:#17935c;--ink:#fff;--danger:#c6402b}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text)}
main{max-width:440px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom))}
h1,h2{margin:0;font-weight:700;letter-spacing:-.02em}
h1{font-size:22px}h2{font-size:18px}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:13px 20px;background:var(--accent);color:var(--ink);cursor:pointer;transition:transform .12s,opacity .2s}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.35;cursor:default}
button.ghost{background:var(--raise);color:var(--text)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;padding:6px 0 22px}
.pill{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--muted);max-width:60%}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--muted)}
body[data-ready=true] .dot{background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}

.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;padding:36px 20px 28px;background:var(--surface);border:1px solid var(--line);border-radius:28px}
.orb{position:relative;display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--raise);color:var(--muted);transition:color .3s,background .3s}
.orb svg{width:34px;height:34px}
body[data-ready=true] .orb{color:var(--ink);background:var(--accent)}
body[data-ready=true] .orb::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.15);opacity:0}}
@media (prefers-reduced-motion:reduce){body[data-ready=true] .orb::after{animation:none}}
.hero button{min-width:180px}
body:not([data-ready=true]) #disconnect{display:none}
body[data-ready=true] #connect{display:none}
#message{margin:0;min-height:1.5em;color:var(--muted);font-size:14px}
#message:empty{display:none}

section{margin-top:28px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.icon{display:grid;place-items:center;width:42px;height:42px;padding:0;border-radius:50%}
.icon svg{width:20px;height:20px}
#scan-status{margin:0 0 10px;color:var(--muted);font-size:14px}
#scan-status:empty{display:none}
body:not([data-ready=true]) .wifi-sec{opacity:.45;pointer-events:none}

#wifi-list{display:flex;flex-direction:column;gap:8px}
.network{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left;font-weight:500;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:16px}
.network:disabled{opacity:.4}
.network .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.network .tag{font-size:12px;font-weight:600;color:var(--accent);padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,transparent)}
.lock{width:15px;height:15px;color:var(--muted);flex:none}
.bars{display:flex;align-items:flex-end;gap:2px;height:16px;flex:none}
.bars i{width:4px;border-radius:2px;background:var(--line)}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px}.bars i:nth-child(3){height:12px}.bars i:nth-child(4){height:16px}
.bars[data-level="1"] i:nth-child(-n+1),.bars[data-level="2"] i:nth-child(-n+2),.bars[data-level="3"] i:nth-child(-n+3),.bars[data-level="4"] i{background:var(--accent)}

.clock{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 14px 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
#clock{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#zone{display:block;font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0}

#wifi{position:fixed;left:0;right:0;bottom:0;max-width:440px;margin:0 auto;padding:12px 20px max(24px,env(safe-area-inset-bottom));background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;box-shadow:0 0 0 100vmax rgba(0,0,0,.55);animation:sheet .22s ease-out}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){#wifi{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
#ssid{width:100%;padding:0;border:0;background:none;color:var(--text);font:700 20px/1.3 "Be Vietnam Pro",system-ui,sans-serif;letter-spacing:-.02em;margin-bottom:16px}
#password-field{position:relative;margin-bottom:16px}
#password{width:100%;padding:14px 64px 14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--raise);color:var(--text);font:inherit}
#toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:8px 12px;background:none;color:var(--accent);font-size:14px}
.actions{display:flex;gap:10px}
.actions #send{flex:1}
[hidden]{display:none!important}
</style>
<main>
<header>
  <h1>HisuOS</h1>
  <div class="pill"><i class="dot"></i><span id="state">Chưa kết nối</span></div>
</header>

<div class="hero">
  <div class="orb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg></div>
  <button id="connect">Kết nối</button>
  <button id="disconnect" class="ghost" disabled>Ngắt kết nối</button>
  <p id="message" role="status" aria-live="polite"></p>
</div>

<section class="wifi-sec">
  <div class="head">
    <h2>Wi-Fi</h2>
    <button id="scan" class="icon ghost" aria-label="Quét lại" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
  </div>
  <p id="scan-status" role="status"></p>
  <div id="wifi-list"></div>
</section>

<section>
  <div class="clock">
    <div id="clock">--:--<span id="zone"></span></div>
    <button id="time" class="ghost" disabled>Đồng bộ</button>
  </div>
</section>
</main>

<form id="wifi" hidden>
  <div class="grab"></div>
  <input id="ssid" readonly aria-label="Wi-Fi đã chọn">
  <div id="password-field">
    <input id="password" type="password" maxlength="64" placeholder="Mật khẩu" autocomplete="new-password" aria-label="Mật khẩu">
    <button id="toggle" type="button">Hiện</button>
  </div>
  <div class="actions">
    <button id="cancel" type="button" class="ghost">Hủy</button>
    <button id="send" disabled>Kết nối</button>
  </div>
</form>
<script type="module" src="app.js"></script>
</html>
